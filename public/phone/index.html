<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>EyeSee</title>
<link rel="manifest" href="/phone/manifest.webmanifest">
<link rel="icon" href="/shared/icon.svg">
<link rel="stylesheet" href="/phone/phone.css">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div id="app">
  <header class="bar">
    <section id="meter" class="meter">
      <button id="meterRow" class="meter-row" aria-expanded="false">
        <span class="meter-label">Understanding</span>
        <span class="track"><span id="meterFill" class="fill"></span><span id="meterThr" class="thr"></span></span>
        <span id="meterScore" class="meter-score">0</span>
      </button>
      <p id="meterNext" class="meter-next"></p>
      <div id="meterDetail" class="meter-detail" hidden></div>
      <button id="consentBtn" class="btn-filled" hidden>Confirm Consent</button>
    </section>
    <button id="more" class="icon" aria-label="More"></button>
  </header>
  <div id="notice" class="notice" hidden></div>
  <div id="symptoms" class="symptoms" hidden></div>

  <main id="feed" class="feed" aria-live="polite"></main>

  <section id="stage" class="stage" hidden>
    <div class="stage-head"><span id="stageTitle"></span><button id="stageClose" class="icon small" aria-label="Close"></button></div>
    <div id="stageBody"></div>
  </section>

  <footer class="dock">
    <form id="typeForm" class="type-form" hidden>
      <input id="typeInput" autocomplete="off" placeholder="Type a message" enterkeyhint="send">
      <button class="send" aria-label="Send"></button>
    </form>
    <div class="controls">
      <button id="plus" class="circle" aria-label="Tools"></button>
      <button id="talk" class="talk" aria-pressed="false"><span class="level"></span><span id="talkIcon"></span><span id="talkLabel">Hold to Talk</span></button>
      <button id="ai" class="orb-btn" aria-label="Ask AI (hold to speak)"><span class="orb"></span></button>
    </div>
  </footer>
</div>

<div id="sheet" class="sheet" hidden><div class="sheet-card"><div class="grabber"></div><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<div id="listening" class="listening" hidden><span class="orb big"></span><p id="listeningText">Listening</p></div>

<script type="module" src="/phone/phone.js"></script>
</body>
</html>
