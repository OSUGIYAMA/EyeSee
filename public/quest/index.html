<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EyeSee</title>
<link rel="icon" href="/shared/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --font: "Inter", "Noto Sans JP", -apple-system, "Hiragino Sans", system-ui, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0c0f; color: #fff; font: 17px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }
  [hidden] { display: none !important; }
  button { font: inherit; cursor: pointer; border: 0; }
  .intro { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; background: radial-gradient(120% 90% at 50% 0%, #2a2d35 0%, #0b0c0f 60%); }
  .card { width: min(440px, 88vw); text-align: center; }
  .word { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .tag { margin: 8px 0 0; font-size: 19px; color: rgba(255,255,255,0.72); font-weight: 500; }
  .lead { margin: 22px auto 34px; max-width: 360px; font-size: 16px; color: rgba(255,255,255,0.5); }
  .primary { display: block; width: 100%; height: 56px; border-radius: 28px; background: #fff; color: #000; font-size: 18px; font-weight: 600; transition: transform 0.15s, background 0.15s; }
  .primary:hover { background: #e8e8ed; }
  .primary:active { transform: scale(0.98); }
  .link { display: inline-block; margin-top: 18px; background: none; color: rgba(255,255,255,0.6); font-size: 15px; font-weight: 500; }
  .link:hover { color: #fff; }
  .status { min-height: 22px; margin-top: 14px; font-size: 14px; color: #ff9f0a; }
  .desk { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 4; display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 26px; background: rgba(60,60,66,0.72); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); width: min(620px, 92vw); }
  .desk input { flex: 1; font: inherit; height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.1); color: #fff; outline: none; }
  .desk button { height: 40px; padding: 0 16px; border-radius: 20px; background: rgba(255,255,255,0.12); color: #fff; font-weight: 600; white-space: nowrap; }
</style>
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>

<section id="intro" class="intro">
  <div class="card">
    <p class="word">EyeSee</p>
    <p id="tagline" class="tag"></p>
    <p id="lead" class="lead"></p>
    <button id="startBtn" class="primary"></button>
    <div id="xrBtns" hidden>
      <button id="arBtn" class="primary" hidden></button>
      <button id="vrBtn" class="primary" hidden></button>
      <button id="deskBtn" class="link"></button>
    </div>
    <div id="status" class="status"></div>
  </div>
</section>

<form id="desk" class="desk" hidden>
  <button type="button" id="micToggle">Mic on</button>
  <input id="deskInput" placeholder="Type as the patient" autocomplete="off">
  <button>Send</button>
</form>

<script type="module" src="/quest/quest.js"></script>
</body>
</html>
